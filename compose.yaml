services:
  tracer:
    build: .
    # Chrome on the host (localhost:9222) binds only to 127.0.0.1 in
    # non-headless mode, even with --remote-debugging-address=0.0.0.0, so it
    # is unreachable through host.docker.internal: use the host network.
    network_mode: host
    volumes:
      - ./sessions:/sessions
    environment:
      CHROME_URL: http://localhost:9222
      SESSION_DIR: /sessions
      NETWORK_BUFFER_SIZE: 1000
      # SCREENSHOT_ENABLED: "true"
    restart: no
